name: Snapshot - Build AmneziaWG for OpenWrt SNAPSHOT

# OpenWrt SNAPSHOT is rebuilt every day and its kernel vermagic changes with it,
# so the packages have to be rebuilt just as often. This workflow does that and
# republishes the result under the rolling `snapshot' pre-release.

on:
  schedule:
    # Daily, a few hours after the OpenWrt SNAPSHOT builds usually finish.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      amneziawg_version:
        description: "YAAWG release tag, branch or commit hash to build"
        type: string
        required: true
        default: "master"
      publish:
        description: "Update the rolling `snapshot' pre-release"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.params.outputs.targets }}
      amneziawg_version: ${{ steps.params.outputs.amneziawg_version }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - name: Checkout YAAWG repository
        uses: actions/checkout@v5

      - name: Resolve parameters
        id: params
        run: |
          set -e -o pipefail
          echo "targets=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"
          echo "amneziawg_version=${{ inputs.amneziawg_version || 'master' }}" >> "$GITHUB_OUTPUT"
          echo "publish=${{ github.event_name == 'schedule' || inputs.publish }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/build-packages.yml
    with:
      openwrt_version: SNAPSHOT
      amneziawg_version: ${{ needs.prepare.outputs.amneziawg_version }}
      openwrt_target: ${{ matrix.target.target }}
      openwrt_subtarget: ${{ matrix.target.subtarget }}
      artifact_prefix: amneziawg-snapshot

  publish:
    name: Publish snapshot
    needs: [ prepare, build ]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack artifacts
        id: pack
        run: |
          set -e -x
          date="$(date -u '+%Y-%m-%d')"
          echo "date=$date" >> "$GITHUB_OUTPUT"

          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czf "dist/${name}-${date}.tar.gz" -C "$dir" .
          done

      - name: Publish snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_DATE: ${{ steps.pack.outputs.date }}
          BUILT_FROM: ${{ needs.prepare.outputs.amneziawg_version }}
        run: |
          set -e

          {
            printf 'Packages built against OpenWrt SNAPSHOT on %s from `%s`.\n\n' \
              "$BUILD_DATE" "$BUILT_FROM"
            printf 'OpenWrt SNAPSHOT changes daily. The kernel module only installs on a firmware\n'
            printf 'whose kernel vermagic matches the one recorded in `build-info.txt` inside the\n'
            printf 'archive, so always grab the build of the same day as your firmware.\n'
          } > notes.md

          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot dist/* \
            --prerelease \
            --title "OpenWrt SNAPSHOT builds (${BUILD_DATE})" \
            --notes-file notes.md
